<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Settings · Flow Notes</title>
    <script>
      // Paint the stored theme before the stylesheet is parsed. This has to stay inline and
      // blocking: settings.js is a deferred module, so without it the page would show the
      // light palette until the module has loaded. Keep in sync with applyTheme() in ui.js.
      (() => {
        const root = document.documentElement;
        let choice = "system";
        try {
          const stored = localStorage.getItem("flownotes:theme");
          if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
        } catch (error) {
          /* Storage may be blocked; the system preference is still a sane default. */
        }
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = choice === "system" ? (systemDark ? "dark" : "light") : choice;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        try {
          const tone = localStorage.getItem("flownotes:tone");
          if (["neutral", "blue", "pink", "red", "yellow", "cyan"].includes(tone)) {
            root.dataset.tone = tone;
          }
        } catch (error) {
          /* Same as above; the neutral scheme is the default anyway. */
        }
      })();
    </script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/vendor/app.css" />
  </head>
  <body>
    <div class="layout">
      <main class="main">
        <header class="app-bar">
          <a
            class="icon-btn"
            id="btn-back"
            href="/"
            data-i18n-title="settings.back"
            data-i18n-aria-label="settings.back"
            title="Back to notes"
            aria-label="Back to notes"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                d="M19 12H6M11.5 6.5L6 12l5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <h1 class="m3-title-large" style="padding-inline-start: 4px" data-i18n="settings.title">
            Settings
          </h1>
        </header>

        <div class="settings" role="region" aria-label="Settings">
          <section class="settings-card" aria-labelledby="card-account">
            <h2 id="card-account" data-i18n="settings.account">Account</h2>
            <div class="settings-row">
              <div class="settings-row__text">
                <p class="m3-body-large" id="account-name">…</p>
                <p class="m3-body-medium" id="account-created"></p>
              </div>
              <span class="chip" id="account-role" data-i18n="settings.role.user">User</span>
            </div>

            <form class="settings-form" id="password-form" novalidate>
              <label class="m3-field" for="current-password">
                <span class="m3-field__label" data-i18n="settings.currentPassword">Current password</span>
                <input id="current-password" type="password" autocomplete="current-password" required />
              </label>
              <label class="m3-field" for="new-password">
                <span class="m3-field__label" data-i18n="settings.newPassword">New password</span>
                <input id="new-password" type="password" autocomplete="new-password" required />
              </label>
              <label class="m3-field" for="confirm-password">
                <span class="m3-field__label" data-i18n="settings.confirmPassword">Confirm new password</span>
                <input id="confirm-password" type="password" autocomplete="new-password" required />
              </label>
              <p class="m3-field__helper" id="password-helper" data-i18n="settings.passwordHint">
                At least 8 characters.
              </p>
              <div class="settings-actions">
                <button
                  class="m3-btn m3-btn--filled"
                  id="btn-password"
                  type="submit"
                  data-i18n="settings.updatePassword"
                >
                  Update password
                </button>
              </div>
            </form>
          </section>

          <section class="settings-card" aria-labelledby="card-appearance">
            <h2 id="card-appearance" data-i18n="settings.appearance">Appearance</h2>
            <p class="m3-body-medium" data-i18n="settings.appearanceHint">Saved on this device only.</p>

            <p class="m3-body-medium" style="margin-top: 14px" data-i18n="settings.theme">Theme</p>
            <div class="segmented" role="radiogroup" aria-label="Theme" id="theme-segmented">
              <button
                class="segmented__item"
                type="button"
                role="radio"
                data-theme-choice="light"
                aria-checked="false"
                data-i18n="settings.theme.light"
              >
                Light
              </button>
              <button
                class="segmented__item"
                type="button"
                role="radio"
                data-theme-choice="dark"
                aria-checked="false"
                data-i18n="settings.theme.dark"
              >
                Dark
              </button>
              <button
                class="segmented__item"
                type="button"
                role="radio"
                data-theme-choice="system"
                aria-checked="false"
                data-i18n="settings.theme.system"
              >
                System
              </button>
            </div>

            <label class="settings-inline" for="language-select">
              <span class="m3-body-medium" data-i18n="settings.language">Language</span>
              <select id="language-select" class="m3-select" aria-label="Language"></select>
            </label>
            <p class="m3-body-medium" style="margin-top: 6px" data-i18n="settings.languageHint">
              Interface language only.
            </p>

            <p class="m3-body-medium" style="margin-top: 16px" data-i18n="settings.tone">Accent colour</p>
            <div class="tone-row" role="radiogroup" aria-label="Accent colour" id="tone-row"></div>
            <p class="m3-body-medium" style="margin-top: 6px" data-i18n="settings.toneHint">
              Saved on this device only.
            </p>
          </section>

          <section class="settings-card" id="users-card" aria-labelledby="card-users" hidden>
            <h2 id="card-users" data-i18n="settings.users">Users</h2>
            <p class="m3-body-medium" data-i18n="settings.usersHint">Only administrators see this.</p>
            <div class="user-list" id="user-list"></div>
            <button class="m3-btn m3-btn--tonal" id="btn-add-user" type="button" data-i18n="settings.addUser">
              Add user
            </button>
          </section>

          <section class="settings-card" aria-labelledby="card-data">
            <h2 id="card-data" data-i18n="settings.data">Data</h2>
            <p class="m3-body-medium" data-i18n="settings.dataHint">
              Notes are plain files; the index can be rebuilt.
            </p>
            <div class="settings-actions">
              <button
                class="m3-btn m3-btn--outlined"
                id="btn-export"
                type="button"
                data-i18n="settings.export"
              >
                Export ZIP
              </button>
              <button
                class="m3-btn m3-btn--outlined"
                id="btn-resync"
                type="button"
                data-i18n="settings.resync"
              >
                Rebuild index
              </button>
              <button class="m3-btn m3-btn--text" id="btn-logout" type="button" data-i18n="settings.logout">
                Sign out
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="dialog-scrim" id="input-dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="input-title">
        <h2 class="dialog__title" id="input-title">Confirm</h2>
        <p class="dialog__body" id="input-body" hidden></p>
        <label class="m3-field" for="input-field">
          <span class="m3-field__label" id="input-label">Name</span>
          <input id="input-field" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <p class="m3-field__helper" id="input-helper"></p>
        <div class="dialog__actions">
          <button class="m3-btn m3-btn--text" id="input-cancel" type="button">Cancel</button>
          <button class="m3-btn m3-btn--filled" id="input-confirm" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <div class="dialog-scrim" id="confirm-dialog" hidden>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 class="dialog__title" id="confirm-title">Confirm</h2>
        <p class="dialog__body" id="confirm-body"></p>
        <div class="dialog__actions">
          <button class="m3-btn m3-btn--text" id="confirm-cancel" type="button">Cancel</button>
          <button class="m3-btn m3-btn--filled" id="confirm-ok" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <div class="snackbar" id="snackbar" role="status" hidden></div>

    <script type="module" src="/static/settings.js"></script>
  </body>
</html>
